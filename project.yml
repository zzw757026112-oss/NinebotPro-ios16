name: "Ninebot Pro+"
options:
  bundleIdPrefix: com.corpsezhao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  "Ninebot Pro+":
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - VehicleBLE.swift
          - Widget
      - path: Vendor/kcp
      - path: Shared/HUDOverlay.swift
      - path: Shared/OrientationRelay.swift
      - path: Shared/DisplayFitRelay.swift
      - path: Shared/HUDSettingsRelay.swift
      - path: Shared/HUDDataRelay.swift
      - path: Shared/ANTBMSRelay.swift
      - path: Shared/SpeedRelay.swift
      - path: Shared/LicenseManager.swift
    dependencies:
      - target: ScreenCast
      - target: NinebotWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Support/BridgingHeader.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/kcp"
    postBuildScripts:
      - script: |
          # Widget 测试（1.3.27）：构建是无签名的，Xcode 不会把 entitlements
          # 嵌进去。构建完用 adhoc 签名把 App Group entitlement 打进去，
          # 否则小组件读不到共享存储，测试本身就没意义。
          ENT="$SRCROOT/Support/AppGroups.entitlements"
          APP="$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME"
          if [ ! -f "$ENT" ]; then echo "error: entitlements not found at $ENT"; exit 1; fi
          if [ ! -d "$APP" ]; then echo "error: app not found at $APP"; exit 1; fi
          # 先签两个扩展（由内向外），再签主 App。
          for APPEX in "$APP/PlugIns/"*.appex; do
            [ -d "$APPEX" ] || continue
            codesign --force --sign - --entitlements "$ENT" "$APPEX" || { echo "error: codesign failed for $APPEX"; exit 1; }
          done
          codesign --force --sign - --entitlements "$ENT" "$APP" || { echo "error: codesign failed for $APP"; exit 1; }
          echo "adhoc-signed with App Group entitlement"
        name: "Adhoc-sign with App Group entitlements"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.3.27"
        CFBundleVersion: "81"
        UILaunchScreen: {}
        UIBackgroundModes: [audio, bluetooth-central, location]
        NSLocalNetworkUsageDescription: 用于连接九号仪表并发送投屏画面（UDP 5012/5013）。
        NSCameraUsageDescription: 用于摄像头画面投屏。
        NSPhotoLibraryUsageDescription: 用于相册图片和视频投屏。
        NSBluetoothAlwaysUsageDescription: 用于直连九号滑板车，读取速度、电量和电压，以及连接 ANT BMS 锂电池读取电池数据，显示在仪表上，以及连接车上的七彩日行灯带（ELK-BLEDOB）进行开关和调色。
        NSLocationWhenInUseUsageDescription: 用于显示当地天气（按定位取天气，叠加到仪表画面上）。
        NSLocationAlwaysAndWhenInUseUsageDescription: 骑行记录需要在后台持续定位（骑行时退后台也继续记里程和速度）；只在骑行时用，不会一直跑定位。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # 屏幕镜像：ReplayKit 录屏广播扩展（Broadcast/）。
  # 扩展自发现仪表，不需要 App Groups；只支持五寸 H.264/RTP。
  ScreenCast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes:
          - README.md
      - path: Shared/HUDOverlay.swift
      - path: Shared/OrientationRelay.swift
      - path: Shared/DisplayFitRelay.swift
      - path: Shared/HUDSettingsRelay.swift
      - path: Shared/HUDDataRelay.swift
      - path: Shared/ANTBMSRelay.swift
      - path: Shared/SpeedRelay.swift
      - path: Shared/LicenseManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast.screencast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.3.27"
        CFBundleVersion: "81"
        # NSExtension MUST live here: xcodegen writes only the
        # properties into the plist, so the NSExtension dict that
        # used to live only in Broadcast/Info.plist was lost and
        # the 0.20.0 build's extension had no NSExtension key —
        # iOS would not recognise it as a broadcast extension.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: ScreenCast.SampleHandler

  # App Groups 测试小组件（1.3.27）：只读共享存储里的 NEWidgetTest 并显示。
  # 读到时间 = App Groups 可用，继续做完整版；显示 NO DATA = 这条路不通。
  # 注意：sources 必须显式列出 Swift 文件。1.3.27 第一版用目录路径
  # Sources/Widget 时，xcodegen 没有把 NinebotWidget.swift 编进去，
  # 打出来的 .appex 里一点 Swift 代码都没有（无 __swift5_types、
  # 不链 WidgetKit/SwiftUI），小组件根本跑不起来。
  NinebotWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget/NinebotWidget.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.corpsezhao.ninebotcast.widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.3.27"
        CFBundleVersion: "81"
        # NSExtension MUST live here (same reason as ScreenCast above).
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: NinebotWidget.NinebotWidgetBundle

schemes:
  "Ninebot Pro+":
    build:
      targets:
        "Ninebot Pro+": all
    run:
      config: Debug
    archive:
      config: Release
